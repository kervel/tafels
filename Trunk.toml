[build]
filehash = true

[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["-c", "for f in ${TRUNK_STAGING_DIR}/*_bg.wasm; do wasm-opt -Oz --enable-reference-types -o \"$f\" \"$f\"; done && find ${TRUNK_STAGING_DIR} -type f \\( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.css' \\) -exec brotli -f -q 11 {} \\;"]
